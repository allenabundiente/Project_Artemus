# ============================================================
# QuestBook — Render Blueprint (one file, one service)
# ============================================================
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates everything below.
#
# What you get:
#   • ONE web service serving the SPA + API on a single port
#     (the Dockerfile builds the frontend and serves it from
#     backend/public — same shape as `./run.sh` production mode)
#   • Migrations run automatically on every boot (idempotent,
#     tracked in schema_migrations — safe on every deploy)
#   • /health as the Render health check (reports DB + LLM mode)
#
# What you paste in once, at sync time:
#   • DATABASE_URL  — your Supabase Postgres URI (see README)
# JWT_SECRET is generated for you by Render. LLM keys are
# optional — add them later in the service's Environment tab;
# without them the app generates challenges via offline heuristics.
# ============================================================

services:
  - type: web
    name: questbook
    runtime: docker
    dockerfilePath: ./Dockerfile   # builds frontend → backend/public, serves both on one port
    plan: free
    region: oregon
    healthCheckPath: /health
    # Deploy only when the repo's CI (typecheck + build + Docker) is green.
    autoDeployTrigger: checksPass

    envVars:
      # Paste your Supabase connection string when Render prompts you.
      #
      # ⚠️ Use the SHARED POOLER (Supavisor) host, NOT the "direct" host.
      # Supabase's direct host (db.<project-ref>.supabase.co:5432) resolves to
      # IPv6 ONLY, and Render has no outbound IPv6 — a direct URL means the
      # container can never reach Postgres.
      #
      #   session mode (recommended for this long-lived server):
      #     postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      #   transaction mode (for serverless / many short connections):
      #     postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
      #
      # Copy the exact URI from Supabase → Project Settings → Database →
      # Connection string (URI) and keep the ?sslmode=require suffix.
      - key: DATABASE_URL
        sync: false

      # Render generates a strong random secret on first sync.
      - key: JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      # ⚠️ Do NOT set API_PORT here. The backend prefers API_PORT over
      # PORT, and Render binds your service to the PORT it injects
      # (server.ts reads both; injected PORT wins as long as API_PORT
      # is unset).

      # --- Optional LLM challenge generation --------------------------
      # Unset/empty = offline heuristic generation (no API calls).
      #
      # EASIEST FREE SETUP — OpenRouter (one key, many :free models):
      #   1. Create a key at https://openrouter.ai/settings/keys
      #   2. Dashboard → questbook → Environment → add:
      #        OPENAI_BASE_URL = https://openrouter.ai/api/v1
      #        OPENAI_API_KEY  = sk-or-v1-…
      #        LLM_MODEL       = deepseek/deepseek-chat-v3:free
      #   (any model tagged :free works; saving env vars redeploys)
      #
      #   ANTHROPIC_API_KEY   (paid, best quality — Claude)
      #   OPENAI_BASE_URL     (also: Gemini / Groq / Ollama — see
      #                        backend/.env.example for per-host values)
      #   OPENAI_API_KEY
      #   LLM_MODEL

      # --- Optional third-party integrations -------------------------------
      # All blank by default: each feature turns itself off and every endpoint
      # behaves exactly as it does today. Fill in only the ones you want in
      # Dashboard → questbook → Environment. GET /health shows which are active.
      #
      # Judge0 (code runner)
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_KEY
        sync: false
      - key: JUDGE0_HOST
        sync: false
      # Cloudflare Turnstile (signup/login CAPTCHA)
      - key: TURNSTILE_SECRET
        sync: false
      # Resend (transactional email)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Upstash Redis (LLM-output cache, rate limits)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # OCR.space (scanned-PDF fallback)
      - key: OCR_SPACE_API_KEY
        sync: false
      # LanguageTool (grammar checks; public API needs no key)
      - key: LANGUAGETOOL_URL
        sync: false
      - key: LANGUAGETOOL_USER
        sync: false
      - key: LANGUAGETOOL_KEY
        sync: false
      # LibreTranslate (translation)
      - key: LIBRETRANSLATE_URL
        sync: false
      - key: LIBRETRANSLATE_KEY
        sync: false
      # OneSignal (web push)
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
      # OpenAI Moderation (guild-chat screening)
      - key: OPENAI_MODERATION_KEY
        sync: false
      # Sentry (error tracking; also needs `npm i @sentry/node`)
      - key: SENTRY_DSN
        sync: false
